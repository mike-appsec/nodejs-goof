name: Snyk Scan to DynamoDB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk CLI
        run: npm install -g --allow-scripts=snyk snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk test (JSON output)
        # Snyk exits with code 1 when vulnerabilities are found - that's expected,
        # not a workflow failure, so we allow it to continue.
        run: snyk test --json > results.json || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boto3
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Push summary to DynamoDB
        run: python push_to_dynamodb.py results.json nodejs-goof npm

      - name: Update Snyk console (monitor)
        run: snyk monitor
